<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHHHHHHHHHHHHHHHHHHH</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal-window {
            width: 90%;
            max-width: 600px;
            background: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(255, 0, 76, 0.2);
            position: relative;
            z-index: 10;
            transition: transform 0.1s;
        }

        .terminal-header {
            background: #1a1a1a;
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 8px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .terminal-body {
            padding: 40px 20px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

    
        #typing-text {
            font-size: 1.2rem;
            color: #0f0; 
            margin-bottom: 30px;
            min-height: 1.5em;
            text-shadow: 0 0 5px #0f0;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background: #0f0;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        button {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 30px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        #yes-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }

        #no-btn {
            border-color: #ff004c;
            color: #ff004c;
        }

        #no-btn:hover {
            background: #ff004c;
            color: #000;
            box-shadow: 0 0 15px #ff004c;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #love-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .love-content {
            z-index: 2;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s ease-out;
        }

        .love-content.show {
            opacity: 1;
            transform: scale(1);
        }

        .heart-svg {
            width: 150px;
            height: 150px;
            fill: #ff004c;
            filter: drop-shadow(0 0 20px #ff004c);
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .love-text {
            font-size: 3rem;
            color: #fff;
            margin-top: 20px;
            text-shadow: 0 0 10px #ff004c, 0 0 20px #ff004c;
            letter-spacing: 5px;
        }

        .particle {
            position: absolute;
            color: #ff004c;
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="terminal-window" id="terminal">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="terminal-body">
            <div id="typing-text"></div>
            <div class="btn-container" id="btn-container">
                <button id="yes-btn">AH😍</button>
                <button id="no-btn">LA😢</button>
            </div>
        </div>
    </div>

    <div id="love-screen">
        <canvas id="matrix-canvas"></canvas>
        <div class="love-content" id="love-content">
            <svg class="heart-svg" viewBox="0 0 32 32">
                <path d="M16,28.261c0,0-14-7.926-14-17.046c0-9.356,13.159-10.399,14-0.454c1.011-9.938,14-8.903,14,0.454C30,20.335,16,28.261,16,28.261z"/>
            </svg>
            <div class="love-text">AA777 KONT 3ARF ❤️</div>
        </div>
    </div>

    <script>
        const textToType = "WAX MOMKIN NTSA7BO ?";
        const typingSpeed = 100;
        const terminal = document.getElementById('terminal');
        const typingText = document.getElementById('typing-text');
        const btnContainer = document.getElementById('btn-container');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const loveScreen = document.getElementById('love-screen');
        const loveContent = document.getElementById('love-content');
        

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq = 440, type = 'square', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        let i = 0;
        function typeWriter() {
            if (i < textToType.length) {
                typingText.innerHTML = textToType.substring(0, i+1) + '<span class="cursor"></span>';
                i++;
                setTimeout(typeWriter, typingSpeed);
            } else {

                btnContainer.style.opacity = '1';
                playBeep(800, 'sine', 0.2);
            }
        }
      
        setTimeout(typeWriter, 1000);

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
            playBeep(150, 'sawtooth', 0.3);
        });

        function moveButton() {
            terminal.classList.add('shake');
            setTimeout(() => terminal.classList.remove('shake'), 500);

            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            
            const phrases = ["LA ?", "FKRI MZYAN", "3AWDI FKRI MZYAN ", "MT2AKDA ?", "YAK🥺 ?"];
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        }


        yesBtn.addEventListener('click', () => {
            playBeep(600, 'sine', 0.1);
            setTimeout(() => playBeep(800, 'sine', 0.2), 100);

            terminal.style.display = 'none';
            
            loveScreen.style.display = 'flex';
            
            startMatrix();

            setTimeout(() => {
                loveContent.classList.add('show');
                createParticles();
            }, 1500);
        });
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789Z';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        const columns = canvas.width/fontSize;

        const rainDrops = [];
        for( let x = 0; x < columns; x++ ) {
            rainDrops[x] = 1;
        }

        function startMatrix() {
            const draw = () => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff004c'; 
                ctx.font = fontSize + 'px monospace';

                for(let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                    ctx.fillText(text, i*fontSize, rainDrops[i]*fontSize);
                    
                    if(rainDrops[i]*fontSize > canvas.height && Math.random() > 0.975){
                        rainDrops[i] = 0;
                    }
                    rainDrops[i]++;
                }
            };
            setInterval(draw, 30);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        function createParticles() {
            setInterval(() => {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.innerText = Math.random() > 0.5 ? '❤️' : '♥';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = Math.random() * 2 + 3 + 's';
                p.style.fontSize = Math.random() * 20 + 10 + 'px';
                loveScreen.appendChild(p);
                
                setTimeout(() => p.remove(), 5000);
            }, 300);
        }

    </script>
</body>
</html>
